<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>정글 밸런스 게임 | 로그인</title>

    <!-- Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet" />
    <!-- base.html용 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Font Awesome -->
    <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
</head>

<body>
    <!-- 헤더 -->
    <header>
        <nav id="top-nav" role="navigation" class="is-white">
            <div class="nav-logo">
                <a class="navbar-item" href="/">
                    <img src="{{ url_for('static', filename='image/kaist_sw-logo.png') }}">
                </a>
            </div>
            <div class="nav-main">

            </div>
        </nav>

        <section class="hero is-success">
            <div class="hero-body center">
                <p class="title">정글 밸런스 게임</p>
                <p class="subtitle is-6">나만의 정글 리추얼 만들기</p>
            </div>
        </section>
    </header>
    <section class="section">
        <div class="container">
            <h1 class="title">로그인</h1>
            <div id="notification" class="notification is-hidden"></div>

          <form id="login-form">
                <div class="field">
                    <p class="control has-icons-left has-icons-right">
                        <input class="input" type="text" id="id" name="id" placeholder="ID" required>
                        <span class="icon is-small is-left">
                            <i class="fas fa-user"></i>
                        </span>
                    </p>
                </div>
                <div class="field">
                    <p class="control has-icons-left">
                        <input class="input" type="password" id="password" name="password" placeholder="Password" required>
                        <span class="icon is-small is-left">
                            <i class="fas fa-lock"></i>
                        </span>
                    </p>
                </div>
                <div class="field">
                    <p class="control">
                        <button class="button is-success">
                            로그인
                        </button>
                    </p>
                </div>
            </form>
            <p>계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
        </div>
    </section>
    <script>
      $('#login-form').submit(function (e) {
        e.preventDefault();

        const id = $('#id').val();
        const password = $('#password').val();

        $.ajax({
            url: '/api/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ id: id, password: password }),
            success: function (response) {
                if (response.success) {
                    $('#notification').removeClass('is-hidden is-danger').addClass('is-success').text("로그인에 성공했습니다. 메인 페이지로 이동합니다.");
                    localStorage.setItem('accessToken', response.token);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    $('#notification').removeClass('is-hidden is-success').addClass('is-danger').text('로그인에 실패했습니다.');
                }
            },
            error: function (xhr) {
                let msg = '로그인에 실패했습니다.';
                $('#notification').removeClass('is-hidden is-success').addClass('is-danger').text(msg);
            }
        });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>정글 밸런스 게임 | 회원가입
    </title>

    <!-- Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet" />
    <!-- base.html용 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Font Awesome -->
    <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
</head>

<body>
    <!-- 헤더 -->
    <header>
        <nav id="top-nav" role="navigation" class="is-white">
            <div class="nav-logo">
                <a class="navbar-item" href="/">
                    <img src="{{ url_for('static', filename='image/kaist_sw-logo.png') }}">
                </a>
            </div>
            <div class="nav-main">
            </div>
        </nav>

        <section class="hero is-success">
            <div class="hero-body center">
                <p class="title">정글 밸런스 게임</p>
                <p class="subtitle is-6">나만의 정글 리추얼 만들기</p>
            </div>
        </section>
    </header>
    <section class="section">
        <div class="container">
            <h1 class="title">회원가입</h1>

            <div id="notification" class="notification is-hidden"></div>

            <form id="register-form">
                <div class="field">
                <p class="control has-icons-left has-icons-right">
                    <input class="input" type="text" name="nickname" placeholder="Nickname" required />
                    <span class="icon is-small is-left">
                    <i class="fas fa-user"></i>
                    </span>
                </p>
                </div>

                <div class="field">
                <p class="control has-icons-left has-icons-right">
                    <input class="input" type="text" name="id" placeholder="ID" required />
                    <span class="icon is-small is-left">
                    <i class="fas fa-user"></i>
                    </span>
                </p>
                </div>

                <div class="field">
                <p class="control has-icons-left">
                    <input class="input" type="password" name="password" placeholder="Password" required />
                    <span class="icon is-small is-left">
                    <i class="fas fa-lock"></i>
                    </span>
                </p>
                </div>

                <div class="field">
                <p class="control has-icons-left">
                    <input class="input" type="date" name="birthday" placeholder="Birthday" required />
                    <span class="icon is-small is-left">
                    <i class="fas fa-calendar"></i>
                    </span>
                </p>
                </div>

                <div class="field">
                <p class="control has-icons-left">
                    <div class="select">
                    <select name="gender" required>
                        <option value="" disabled selected>Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    </div>
                    <span class="icon is-small is-left">
                    <i class="fas fa-venus-mars"></i>
                    </span>
                </p>
                </div>

                <div class="field">
                <p class="control">
                    <button class="button is-success" type="submit">
                    등록
                    </button>
                </p>
                </div>
            </form>
            <p>이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
        </div>
    </section>
    <script>
        $(document).ready(function () {
        $('#register-form').on('submit', function (e) {
            e.preventDefault();

            const formData = {
                nickname: $('input[name="nickname"]').val(),
                id: $('input[name="id"]').val(),
                password: $('input[name="password"]').val(),
                birthday: $('input[name="birthday"]').val(),
                gender: $('select[name="gender"]').val(),
            };

            $.ajax({
            url: '{{ url_for("register_api") }}',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function (response) {
                if (response.success) {
                $('#notification')
                    .removeClass('is-hidden is-danger')
                    .addClass('is-success')
                    .text('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
                } else {
                $('#notification')
                    .removeClass('is-hidden is-success')
                    .addClass('is-danger')
                    .text(response.message || '회원가입에 실패했습니다.');
                }
            },
            error: function (xhr) {
                let msg = '회원가입에 실패했습니다.';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                msg = xhr.responseJSON.message;
                }
                $('#notification').removeClass('is-hidden is-success').addClass('is-danger').text(msg);
            },
            });
        });
        });
    </script>
</body>
</html>

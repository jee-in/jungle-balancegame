<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>My Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
</head>
<body>
<!-- 헤더 -->
<header>
    <nav id="top-nav" role="navigation" class="is-white">
        <div class="nav-logo">
            <a class="navbar-item" href="/">
                <img src="{{ url_for('static', filename='image/kaist_sw-logo.png') }}">
            </a>
        </div>
        <div class="nav-main">
            <div class="field is-grouped" id="auth-buttons">
            </div>
        </div>
    </nav>

    <section class="hero is-success">
        <div class="hero-body center">
            <p class="title">정글 밸런스 게임</p>
            <p class="subtitle is-6">나만의 정글 리추얼 만들기</p>
        </div>
    </section>
</header>

<section class="section">
    <div class="container">
        <h1 class="title">My Page</h1>
        <h2>참여한 밸런스 게임 목록</h2>
        <div id="participated-question-list" class="question-card-wrap"></div>
        <br>
        <h2>생성한 밸런스 게임 목록</h2>
        <div id="created-question-list" class="question-card-wrap"></div>
        <br>
        <h2>좋아요 누른 밸런스 게임 목록</h2>
        <div id="liked-question-list" class="question-card-wrap"></div>
    </div>
</section>
<script>
    $(document).ready(function () {
        showLoginStatus();

        fetchParticipatedQuestions();
        fetchCreatedQuestions();
        fetchLikedQuestions();
    })

    function addQuestionCard(questions, containerId) {
        $('#question-list').empty();

        for (let i = 0; i < questions.length; i++) {
            let category = questions[i]['category'];
            let qId = questions[i]['_id'];
            let q1 = questions[i]['question1'];
            let q2 = questions[i]['question2'];
            let createdAt = new Date(questions[i]['created_at']).toLocaleDateString();

            let card =
                `<div id="${category}-${qId}" class="question-card card" onclick="window.location.href='/question/${qId}'">
                    <input class="question-id" type=hidden value="${qId}">
                    <div class="card-content">
                        <div class="media">
                            <div class="media-content">
                                <p class="title is-4">
                                    <span>${q1}</span> VS <span>${q2}</span>
                                </p>
                            </div>
                        </div>
                </div>`;
            $(`#${containerId}`).append(card);
        }
    }

    function fetchParticipatedQuestions() {
        const token = localStorage.getItem('accessToken');
        if (!token) {
            alert('로그인이 필요합니다');
            return;
        }

        $.ajax({
            url: '/api/questions/participated',
            type: 'GET',
            headers: { Authorization: 'Bearer ' + token },
            success: function(res) {
                addQuestionCard(res.questions, "participated-question-list");
            },
            error: function() {
                alert('참여한 질문 목록을 불러오지 못했습니다.');
            }
        });
    }

    function fetchCreatedQuestions() {
        const token = localStorage.getItem('accessToken');
        if (!token) {
            alert('로그인이 필요합니다');
            return;
        }

        $.ajax({
            url: '/api/questions/created',
            type: 'GET',
            headers: { Authorization: 'Bearer ' + token },
            success: function(res) {
                addQuestionCard(res.questions, "created-question-list");
            },
            error: function() {
                alert('생성한 질문 목록을 불러오지 못했습니다.');
            }
        });
    }

    function fetchLikedQuestions() {
        const token = localStorage.getItem('accessToken');
        if (!token) {
            alert('로그인이 필요합니다');
            return;
        }

        $.ajax({
            url: '/api/questions/liked',
            type: 'GET',
            headers: { Authorization: 'Bearer ' + token },
            success: function(res) {
                addQuestionCard(res.questions, "liked-question-list");
            },
            error: function() {
                alert('좋아요 누른 질문 목록을 불러오지 못했습니다.');
            }
        });
    }

    // 로그인 상태일 경우: 토큰 디코딩해서 사용자 정보 요청
    function showLoginStatus() {
        const token = localStorage.getItem("accessToken");
        const authButtons = document.getElementById("auth-buttons");

        if (!token) {
            authButtons.innerHTML = `
                <a class="button" href="/login">로그인</a>
            `;
            return;
        }

        $.ajax({
            url: "/api/auth/userinfo",
            type: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            },
            success: function (res) {
                const nickname = res.nickname;

                authButtons.innerHTML = `
                    <div class="member-nickname"><span class="tag is-link is-light">${nickname}</span>님 안녕하세요</div>
                    <form id="logout-form" style="margin-right: 10px;">
                        <button class="button" type="button">로그아웃</button>
                    </form>
                `;

                document.getElementById("logout-form").addEventListener("click", function (e) {
                    e.preventDefault();
                    localStorage.removeItem("accessToken");
                    window.location.reload();
                });
            },
            error: function () {
                console.log("error");
            }
        });
    }
</script>
</body>
</html>

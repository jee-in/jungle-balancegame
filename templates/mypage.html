<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>My Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css">
    <link rel="stylesheet" href="../static/css/base.css">
</head>
<body>
<!-- 헤더 -->
<header>
    <nav id="top-nav" role="navigation" class="is-white">
        <div class="nav-logo">
            <a class="navbar-item" href="/">
                <img src="{{ url_for('static', filename='image/kaist_sw-logo.png') }}">
            </a>
        </div>
        <div class="nav-main">
            <div class="field is-grouped" id="auth-buttons">
            </div>
        </div>
    </nav>

    <section class="hero is-success">
        <div class="hero-body center">
            <p class="title">정글 밸런스 게임</p>
            <p class="subtitle is-6">나만의 정글 리추얼 만들기</p>
        </div>
    </section>
</header>

<section class="section">
    <div class="container">
        <h1 class="title">My Page</h1>
        <h2>참여한 밸런스 게임 목록</h2>
        <br>
        <br>
        <h2>생성한 밸런스 게임 목록</h2>
        <br>
        <br>
        <h2>좋아요 누른 밸런스 게임 목록</h2>
    </div>
</section>
<script>
    $(document).ready(function () {
        showLoginStatus();
    })

    // 로그인 상태일 경우: 토큰 디코딩해서 사용자 정보 요청
    function showLoginStatus() {
        const token = localStorage.getItem("accessToken");
        const authButtons = document.getElementById("auth-buttons");

        if (!token) {
            authButtons.innerHTML = `
                <a class="button" href="/login">로그인</a>
            `;
            return;
        }

        $.ajax({
            url: "/api/auth/userinfo",
            type: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            },
            success: function (res) {
                const nickname = res.nickname;

                authButtons.innerHTML = `
                    <div class="member-nickname"><span class="tag is-link is-light">${nickname}</span>님 안녕하세요</div>
                    <form id="logout-form" style="margin-right: 10px;">
                        <button class="button" type="button">로그아웃</button>
                    </form>
                `;

                document.getElementById("logout-form").addEventListener("click", function (e) {
                    e.preventDefault();
                    localStorage.removeItem("accessToken");
                    window.location.reload();
                });
            },
            error: function () {
                console.log("error");
            }
        });
    }
</script>
</body>
</html>
